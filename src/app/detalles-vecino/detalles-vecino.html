<div class="form-container">
  <h2>{{ isEditMode ? 'Editar Vecino' : 'Nuevo Vecino' }}</h2>
  
  <div class="form-section">
    <h3>Información Básica</h3>
    
    <div class="form-group" *ngIf="isEditMode">
      <label for="id">ID</label>
      <input id="id" type="text" [value]="vecino.id" disabled class="readonly-field">
      <div class="field-hint">El ID no se puede modificar</div>
    </div>
    
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" [(ngModel)]="vecino.nombre" placeholder="Ej: Juan">
    </div>
    
    <div class="form-group">
      <label for="apellido">Apellido</label>
      <input id="apellido" type="text" [(ngModel)]="vecino.apellido" placeholder="Ej: Pérez">
    </div>
    
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" [(ngModel)]="vecino.email" placeholder="Ej: juan.perez@email.com">
    </div>
    
    <div class="form-group" *ngIf="isEditMode">
      <label for="idlocation">ID de la Casa</label>
      <input id="idlocation" type="text" [value]="vecino.idlocation" disabled class="readonly-field">
      <div class="field-hint">La casa asociada no se puede modificar</div>
    </div>
  </div>
  
  <div class="form-actions">
    <button class="btn btn-primary" (click)="guardar()">
      {{ isEditMode ? 'Guardar Cambios' : 'Crear Vecino' }}
    </button>
    <button class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
  </div>
</div>
